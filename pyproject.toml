[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itr-stock-assist"
version = "0.3.0"
description = "Local-first Indian equity capital-gains working papers"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["stock_assist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real Chromium and browser runtime; needs network access to the public runtime CDN"]
